<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Robot Run</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;background:#0B1330}
body{
  height:100%;margin:0;background:#0B1330;color:#F3F3EF;overflow:hidden;
  font-family:"Silkscreen",ui-monospace,"Courier New",monospace;
  display:flex;align-items:center;justify-content:center;
  touch-action:manipulation;-webkit-touch-callout:none;
}
.stage{position:relative;width:100vw;height:100vh;--u:10px;--uk:8.2px;transition:width .25s ease,height .25s ease;flex:none}
.stage.compact{box-shadow:0 0 0 calc(.25*var(--u)) #F3F3EF,0 0 0 calc(.5*var(--u)) #1A1B22,0 calc(.9*var(--u)) 0 calc(.5*var(--u)) rgba(0,0,0,.35)}
.sizeBtn{position:absolute;top:calc(1.32*var(--u));right:calc(1.2*var(--u));width:calc(4.8*var(--u));height:calc(4.8*var(--u));padding:0;display:flex;align-items:center;justify-content:center;background:rgba(14,22,48,.55);color:#fff;border:calc(0.27*var(--u)) solid rgba(255,255,255,.8);border-radius:0;cursor:pointer;z-index:5;touch-action:manipulation}
.sizeBtn:active{background:rgba(255,210,63,.5)}
.sizeBtn svg{width:60%;height:60%;shape-rendering:crispEdges}
canvas{width:100%;height:100%;display:block;touch-action:none}
canvas:focus{outline:none}
.touch{display:flex;position:absolute;left:0;right:0;bottom:0;justify-content:space-between;padding:calc(2*var(--u));pointer-events:none}
.touch .pad{display:flex;}
.touch button{
  pointer-events:auto;width:calc(10*var(--u));height:calc(10*var(--u));border-radius:50%;padding:0;
  display:flex;align-items:center;justify-content:center;
  border:calc(.3*var(--u)) solid rgba(255,255,255,.65);background:rgba(30,25,60,.35);color:#fff;
  touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer;
}
.touch button svg{width:52%;height:52%;shape-rendering:crispEdges;pointer-events:none}
.touch button:active{background:rgba(255,210,63,.45)}
.panel{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;align-items:center;justify-content:center;background:rgba(14,22,48,.72);overflow:auto;padding:calc(2*var(--u));box-sizing:border-box}
.panel[hidden]{display:none}
.card{background:#14204A;color:#F3F3EF;border:calc(.35*var(--u)) solid #F3F3EF;box-shadow:0 0 0 calc(.35*var(--u)) #1A1B22,calc(.8*var(--u)) calc(.8*var(--u)) 0 calc(.35*var(--u)) rgba(0,0,0,.35);padding:calc(2.4*var(--u)) calc(3*var(--u));width:calc(64*var(--u));max-width:100%;display:flex;flex-direction:column;align-items:center;text-align:center;box-sizing:border-box;margin:auto}
.card.wide{width:calc(72*var(--u));max-width:100%}
#dupPanel .card{--u:calc(var(--uk) * 0.9756);width:calc(56*var(--u))}
#dupPanel .sub{font-size:calc(2*var(--u))}
#namePanel .card,#pwPanel .card{--u:var(--uk);width:calc(70*var(--u))}
.card h2{margin:0;font-weight:700;font-size:calc(3.8*var(--u));color:#FFD23F}
.sub{margin:0;font-size:calc(1.7*var(--u));color:#C9D6F2;line-height:1.4}
#nameInput{font:700 calc(3*var(--u)) "Silkscreen",monospace;width:100%;max-width:calc(44*var(--u));padding:.35em .6em;border:calc(.35*var(--u)) solid #F3F3EF;background:#0B1330;color:#fff;text-align:center;letter-spacing:.08em;text-transform:uppercase;border-radius:0;box-sizing:border-box}
#pwInput{font:700 calc(3*var(--u)) "Silkscreen",monospace;width:100%;max-width:calc(44*var(--u));padding:.35em .6em;border:calc(.35*var(--u)) solid #F3F3EF;background:#0B1330;color:#fff;text-align:center;letter-spacing:.08em;text-transform:uppercase;border-radius:0;box-sizing:border-box}
#nameInput::placeholder{color:#7083B8;text-transform:none;letter-spacing:0}
#nameInput,#pwInput{cursor:default;caret-color:transparent}
#nameInput:focus{outline:calc(.35*var(--u)) solid #47F2FF;outline-offset:2px}
.osk{display:flex;flex-direction:column;width:100%}
.osk[hidden]{display:none}
.osk .row{display:flex;justify-content:center;}
.osk button{flex:0 0 auto;width:calc(5.2*var(--u));height:calc(5*var(--u));font:700 calc(2*var(--u)) "Silkscreen",monospace;background:#2B3A6E;color:#fff;border:calc(.25*var(--u)) solid #5F75B8;border-bottom-width:calc(.5*var(--u));border-radius:calc(.4*var(--u));touch-action:manipulation;user-select:none;-webkit-user-select:none;padding:0;cursor:pointer}
.osk button:active{transform:translateY(calc(.25*var(--u)));border-bottom-width:calc(.25*var(--u))}
.osk button.wide{width:calc(24*var(--u))}
.osk button[data-v="BACK"]{font-size:calc(3.2*var(--u));line-height:1}
.osk button.go{width:calc(16*var(--u));background:#FFD23F;color:#1A1B22;border-color:#9C7A12}
.primary{font:700 calc(2.8*var(--u)) "Silkscreen",monospace;background:#FFD23F;color:#1A1B22;border:calc(.35*var(--u)) solid #1A1B22;box-shadow:0 calc(.5*var(--u)) 0 #9C7A12;padding:.35em 1.6em;cursor:pointer;touch-action:manipulation}
.primary:disabled{opacity:.45;cursor:default}
.primary:active:not(:disabled){transform:translateY(calc(.35*var(--u)));box-shadow:0 calc(.15*var(--u)) 0 #9C7A12}
.links{display:flex;justify-content:center;flex-wrap:wrap}
.link{background:none;border:none;color:#9FD8FF;font:400 calc(1.7*var(--u)) "Silkscreen",monospace;text-decoration:underline;cursor:pointer;padding:4px}
.link[hidden],.links[hidden]{display:none}
.lb{width:100%;border-collapse:collapse;font-size:calc(2*var(--u))}
.lb th{color:#9FD8FF;font-weight:700;padding:calc(.4*var(--u)) calc(.9*var(--u));border-bottom:calc(.25*var(--u)) solid #3B4D86;text-align:left}
.lb td{padding:calc(.4*var(--u)) calc(.9*var(--u));text-align:left}
.lb td:nth-child(n+3),.lb th:nth-child(n+3){text-align:right;font-variant-numeric:tabular-nums}
.lb tr.me td{background:#FFD23F;color:#1A1B22}
.lb tr.gap td{color:#6F7FAF;text-align:center}
.resetBtn{position:absolute;right:calc(2*var(--u));bottom:calc(2*var(--u));width:calc(6*var(--u));height:calc(6*var(--u));padding:0;display:flex;align-items:center;justify-content:center;background:rgba(14,22,48,.75);color:#fff;border:calc(.35*var(--u)) solid rgba(255,255,255,.8);cursor:pointer;touch-action:manipulation;z-index:2}
.resetBtn:active{background:rgba(255,210,63,.5)}
.resetBtn svg{width:60%;height:60%;shape-rendering:crispEdges}
.panel.top{z-index:6}
.pwmsg{margin:0;min-height:1.4em;font-size:calc(1.8*var(--u));color:#FF8FA3}
.pwmsg.ok{color:#9BE564}
.pwbtns{display:flex;justify-content:center}
.primary.ghost{background:#2B3A6E;color:#fff;border-color:#5F75B8;box-shadow:0 calc(.5*var(--u)) 0 #1A2550}
.lb tr.empty td{text-align:center;color:#8EA0D0;padding:calc(1.4*var(--u))}
.touch .pad>*+*{margin-left:calc(2*var(--u))}
.card>*+*{margin-top:calc(1.3*var(--u))}
.osk>*+*{margin-top:calc(.6*var(--u))}
.osk .row>*+*{margin-left:calc(.6*var(--u))}
.links>*+*{margin-left:calc(3*var(--u))}
.pwbtns>*+*{margin-left:calc(2*var(--u))}
</style>
</head>
<body>
<div class="stage">
  <canvas id="game" tabindex="0" aria-label="Platformer game. Use arrow keys to move and space to jump."></canvas>
  <div class="touch" aria-hidden="true">
    <button data-k="jump" class="jump" aria-label="Jump"><svg viewBox="0 0 13 13" aria-hidden="true"><g transform="translate(1 1)"><path d="M1 4h5V1h1v1h1v1h1v1h1v1h1v2h-1v1h-1v1h-1v1h-1v1h-1v1H6V8H1z" fill="#1A1B22" transform="rotate(-90 6 6)"/></g><path d="M1 4h5V1h1v1h1v1h1v1h1v1h1v2h-1v1h-1v1h-1v1h-1v1h-1v1H6V8H1z" fill="#FFFFFF" transform="rotate(-90 6 6)"/></svg></button>
    <div class="pad">
      <button data-k="left" aria-label="Left"><svg viewBox="0 0 13 13" aria-hidden="true"><g transform="translate(1 1)"><path d="M1 4h5V1h1v1h1v1h1v1h1v1h1v2h-1v1h-1v1h-1v1h-1v1h-1v1H6V8H1z" fill="#1A1B22" transform="translate(12 0) scale(-1 1)"/></g><path d="M1 4h5V1h1v1h1v1h1v1h1v1h1v2h-1v1h-1v1h-1v1h-1v1h-1v1H6V8H1z" fill="#FFFFFF" transform="translate(12 0) scale(-1 1)"/></svg></button>
      <button data-k="right" aria-label="Right"><svg viewBox="0 0 13 13" aria-hidden="true"><g transform="translate(1 1)"><path d="M1 4h5V1h1v1h1v1h1v1h1v1h1v2h-1v1h-1v1h-1v1h-1v1h-1v1H6V8H1z" fill="#1A1B22" transform=""/></g><path d="M1 4h5V1h1v1h1v1h1v1h1v1h1v2h-1v1h-1v1h-1v1h-1v1h-1v1H6V8H1z" fill="#FFFFFF" transform=""/></svg></button>
    </div>
  </div>
  <div class="panel" id="namePanel">
    <div class="card">
      <h2>Enter your name</h2>
      <p class="sub" id="nameSub">Collect gems and reach the flag within 90 seconds. More gems and a faster finish mean more points.</p>
      <input id="nameInput" readonly inputmode="none" tabindex="-1" maxlength="12" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" placeholder="Your name" aria-label="Your name">
      <div class="osk" id="osk" hidden></div>
      <button class="primary" id="startBtn" type="button" disabled>Start</button>
      <div class="links">
        <button class="link" id="boardBtn" type="button">View leaderboard</button>
      </div>
    </div>
  </div>
  <div class="panel" id="boardPanel" hidden>
    <div class="card wide">
      <h2 id="resultTitle">Leaderboard</h2>
      <table class="lb">
        <thead><tr><th>#</th><th>Name</th><th>Gems</th><th>Time</th><th>Points</th></tr></thead>
        <tbody id="lbBody"></tbody>
      </table>
      <button class="primary" id="againBtn" type="button">Play again</button>
    </div>
    <button class="resetBtn" id="resetBtn" type="button" aria-label="Reset scoreboard"><svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M5 1h6v2h2v2h-2v2h-2V5H7V3H5zM3 3h2v2H3zM1 5h2v6H1zM3 11h2v2H3zM5 13h6v2H5zM11 11h2v2h-2zM13 7h2v4h-2zM9 7h6v2H9z"/></svg></button>
  </div>
  <div class="panel top" id="dupPanel" hidden>
    <div class="card">
      <h2>A user with this name already exists.</h2>
      <div class="pwbtns">
        <button class="primary ghost" id="dupRename" type="button">Rename</button>
        <button class="primary" id="dupPlay" type="button">Play again</button>
      </div>
    </div>
  </div>
  <div class="panel top" id="pwPanel" hidden>
    <div class="card">
      <h2>Reset scoreboard</h2>
      <input id="pwInput" readonly inputmode="none" tabindex="-1" placeholder="Password" aria-label="Password">
      <div class="osk" id="pwOsk"></div>
      <p class="pwmsg" id="pwMsg"></p>
      <div class="pwbtns">
        <button class="primary ghost" id="pwCancel" type="button">Cancel</button>
        <button class="primary" id="pwOk" type="button">Reset</button>
      </div>
    </div>
  </div>
  <button class="sizeBtn" id="sizeBtn" type="button" aria-label="Make game smaller"></button>
</div>

<script>
(() => {
const T = 32, VH = 384, H = 12, W = 160;
let VW = 640;
const SOLID = new Set(['#', '=', 'S', 'B', 'E']);
const GOAL_X = 138;
const BUILD_X = 143;
// ---------- Pixel-art robot ----------
const PAL = {K:'#1A1B22', W:'#F3F3EF', G:'#C2C5CF', V:'#0E0F14', C:'#47F2FF', c:'#1AA6C4', D:'#3B3C46'};
const HEAD = [
  '...K........K...',
  '...KK......KK...',
  '...KWK....KWK...',
  '...KWWKKKKWWK...',
  '..KWWWWWWWWWWK..',
  '.KWWWWWWWWWWWWK.',
  '.KWWWWKKKKKKKKK.',
  '.KcCWKVVVVVVVVK.',
  '.KCcWKVVCCVVCCK.',
  '.KcCWKVVCCVVCCK.',
  '.KWWWWKVVVVVVVK.',
  '..KWWWWKKKKKKK..',
  '...KKKKKKKKKK...',
  '......KDK.......'];
const TORSO = {
  idle: ['.....KWWWWK.....','....KWWWWWWK....','....KWWGGWWK....','....KDDGGDDK....','....KWWKKWWK....','....KWWWWWWK....'],
  fwd:  ['.....KWWWWK.....','....KWWWWWWK....','....KWWGGGGKK...','....KDDDDDKKK...','....KWWWWWWK....','....KWWWWWWK....'],
  back: ['.....KWWWWK.....','...KKWWWWWWK....','..KKGGWWWWWK....','..KK.KDDDDDK....','....KWWWWWWK....','....KWWWWWWK....'],
  up:   ['.....KWWWWK.KK..','....KWWWWWWKKK..','....KWWWWWGK....','....KDDDDDDK....','....KWWWWWWK....','....KWWWWWWK....']};
const LEGS = {
  stand:  ['.....KWKKWK.....','.....KDK.KDK....','.....KWK.KWK....','....KWWK.KWWK...','....KWWWKKWWWK..','....KKKKKKKKKK..'],
  stride: ['.....KWWWWK.....','....KWK..KWK....','...KWK....KWK...','..KDK......KDK..','.KWWK.....KWWWK.','.KKKK.....KKKKK.'],
  pass:   ['.....KWWWWK.....','.....KWK.KWK....','....KDK..KWK....','...KWK...KDK....','..KKK...KWWWK...','........KKKKK...'],
  run1:   ['.....KWWWWK.....','....KGK..KWK....','...KGK....KWK...','..KDK......KDK..','.KGGK.....KWWWK.','.KKKK.....KKKKK.'],
  run2:   ['.....KWWWWK.....','.....KWKGGGGK...','.....KWKKKKGK...','.....KDK...KGGK.','....KWWWK..KKKK.','....KKKKK.......'],
  run3:   ['.....KWWWWK.....','....KWK..KGK....','...KWK....KGK...','..KDK......KDK..','.KWWK.....KGGGK.','.KKKK.....KKKKK.'],
  run4:   ['.....KWWWWK.....','.....KGKWWWWK...','.....KGKKKKWK...','.....KDK...KWWK.','....KGGGK..KKKK.','....KKKKK.......'],
  tuck:   ['.....KWWWWWK....','....KWK.KWWWK...','...KWK..KDDK....','..KDK...KWWK....','.KWWK...KWWWK...','.KKKK...KKKKK...']};
function makeFrame(torso, legs, blink) {
  const rows = HEAD.concat(TORSO[torso], LEGS[legs]);
  const c = document.createElement('canvas'); c.width = 16; c.height = rows.length;
  const g = c.getContext('2d');
  rows.forEach((r, y) => {
    for (let x = 0; x < 16; x++) {
      let ch = r[x];
      if (blink && (y === 8 || y === 9) && ch === 'C' && x > 5) ch = y === 9 ? 'c' : 'V';
      if (ch && ch !== '.') { g.fillStyle = PAL[ch]; g.fillRect(x, y, 1, 1); }
    }
  });
  return c;
}
const FR = {
  idle: makeFrame('idle', 'stand', false),
  blink: makeFrame('idle', 'stand', true),
  run: [makeFrame('back', 'run1'), makeFrame('idle', 'run2'), makeFrame('fwd', 'run3'), makeFrame('idle', 'run4')],
  jump: makeFrame('up', 'tuck'),
  cheer: makeFrame('up', 'stand')
};
// ---------- Pixel helpers: enemies, hearts, finish flag ----------
function pix(rows, pal) {
  const c = document.createElement('canvas'); c.width = rows[0].length; c.height = rows.length;
  const g = c.getContext('2d');
  rows.forEach((r, y) => { for (let x = 0; x < r.length; x++) if (pal[r[x]]) { g.fillStyle = pal[r[x]]; g.fillRect(x, y, 1, 1); } });
  return c;
}
const EPAL = {o: '#2E1A45', p: '#8E5DB8', l: '#B98BE0', s: '#E6D3FA', w: '#FFFFFF', e: '#2E1A45'};
const EBODY = ['...s..s..s..', '..oooooooo..', '.oppppppppo.', 'opwwpppwwppo', 'opewpppewppo', 'oppppppppplo', 'oppooooopplo', '.oppppppplo.', '..oooooooo..'];
const ENEMY = [pix(EBODY.concat(['..oo....oo..']), EPAL), pix(EBODY.concat(['...oo..oo...']), EPAL)];
const ENEMY_FLAT = pix(['..oooooooo..', '.opwwppwwpo.', 'oppppppppplo', '.oooooooooo.'], EPAL);
const HEART = pix(['.ooo.ooo.', 'orwrorrro', 'orwrrrrro', 'orrrrrrdo', '.orrrrdo.', '..orrdo..', '...odo...', '....o....'],
  {o: '#3A0A18', r: '#FF4D6D', w: '#FFD0DA', d: '#B3123E'});
const POLE_BALL = pix(['..oooo..', '.oyyyyo.', 'oywyyyyo', 'oyyyyydo', 'oyyyyydo', 'oyyyyddo', '.oyddd o.'.replace(' ', ''), '..oooo..'],
  {o: '#5A4410', y: '#FFD23F', w: '#FFF6C8', d: '#C9971A'});
const FLAG_PX = (() => {
  const G = {S: ['.###', '#...', '.##.', '...#', '###.'], A: ['.##.', '#..#', '####', '#..#', '#..#'], P: ['###.', '#..#', '###.', '#...', '#...']};
  const c = document.createElement('canvas'); c.width = 20; c.height = 10;
  const g = c.getContext('2d');
  for (let y = 0; y < 10; y++) {
    g.fillStyle = y < 3 ? '#19B9F0' : y < 7 ? '#0E8EDB' : '#1E63BE';
    g.fillRect(0, y, 20 - y, 1);
  }
  g.fillStyle = '#FFFFFF';
  [['S', 2], ['A', 7], ['P', 12]].forEach(([ch, ox]) =>
    G[ch].forEach((r, y) => { for (let x = 0; x < 4; x++) if (r[x] === '#') g.fillRect(ox + x, 2 + y, 1, 1); }));
  return c;
})();
const CONFETTI_COLORS = ['#FFD23F', '#FF4D6D', '#47F2FF', '#9BE564', '#9A5CF0', '#19B9F0', '#FFFFFF'];
let confetti = [];
function launchConfetti() {
  confetti = [];
  const px = player.x + player.w / 2 - cam, py = player.y;
  for (let i = 0; i < 90; i++) confetti.push({x: Math.random() * VW, y: -Math.random() * 120, vx: (Math.random() - 0.5) * 1.5, vy: 1 + Math.random() * 2,
    c: CONFETTI_COLORS[i % CONFETTI_COLORS.length], ph: Math.random() * 6});
  for (let i = 0; i < 60; i++) confetti.push({x: px, y: py, vx: (Math.random() - 0.5) * 9, vy: -3 - Math.random() * 6,
    c: CONFETTI_COLORS[(i * 3) % CONFETTI_COLORS.length], ph: Math.random() * 6});
}
function updateWin() {
  const p = player, doorX = BUILD_X * T + 196;
  cam = Math.min(clamp(p.x - VW * 0.4, cam, W * T - VW), W * T - VW);
  if (winPhase === 'walk') {
    p.face = 1;
    p.vx = 3;
    p.vy = Math.min(p.vy + 0.6, 12);
    move(p);
    p.run += Math.abs(p.vx) * 0.05;
    if (p.x + p.w / 2 >= doorX) { p.x = doorX - p.w / 2; p.vx = 0; winPhase = 'enter'; winT = 24; }
  } else if (winPhase === 'enter') {
    p.vy = Math.min(p.vy + 0.6, 12); move(p);
    if (--winT <= 0) { winPhase = 'party'; winT = 110; launchConfetti(); }
  } else if (--winT <= 0) endRun('win');
}

function updateConfetti() {
  for (const q of confetti) { q.vy = Math.min(q.vy + 0.18, 3.2); q.vx *= 0.97; q.x += q.vx + Math.sin(frame * 0.1 + q.ph) * 0.4; q.y += q.vy; }
  confetti = confetti.filter(q => q.y < VH + 10);
}
function drawConfetti() {
  for (const q of confetti) {
    const x = Math.round(q.x / 2) * 2, y = Math.round(q.y / 2) * 2;
    const turn = Math.floor(frame / 6 + q.ph) % 3;
    ctx.fillStyle = q.c;
    if (turn === 0) ctx.fillRect(x, y, 6, 2); else if (turn === 1) ctx.fillRect(x, y, 4, 4); else ctx.fillRect(x, y, 2, 6);
  }
}

// ---------- Pixel-art gem logo (16x14) ----------
const LOGO_PX = (() => {
  const P = {o: '#24127A', d: '#3A1FC8', m: '#5B2BE8', l: '#9A5CF0', p: '#D58BF0', w: '#FFFFFF'};
  const rows = [
    '...oooooooooo...',
    '..odmmmlllppo...',
    '.odmmmmllppppo..',
    'oddmmmmlllpwpppo',
    'oddmmmmllpwwwppo',
    'odddmmmmlwwwwwpo',
    'oddmmmmllpwwwlpo',
    '.oddmmmmllpwplo.',
    '..oddmmmmlllmo..',
    '...oddmmmlmmo...',
    '....oddmmmmo....',
    '.....odmmmo.....',
    '......odmo......',
    '.......oo.......'];
  const c = document.createElement('canvas'); c.width = 16; c.height = 14;
  const g = c.getContext('2d');
  rows.forEach((r, y) => { for (let x = 0; x < 16; x++) if (P[r[x]]) { g.fillStyle = P[r[x]]; g.fillRect(x, y, 1, 1); } });
  return c;
})();

const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
let SCALE = 2;
cv.width = VW * SCALE; cv.height = VH * SCALE;
function fitCanvas() {
  const r = cv.getBoundingClientRect();
  if (!r.width || !r.height) return;
  VW = Math.max(480, Math.min(1100, VH * r.width / r.height));

const stars = Array.from({length: 45}, (_, i) => ({

// ---------- Level ----------
function buildLevel() {
  grid = Array.from({length: H}, () => Array(W).fill(' '));
  coins = []; spawns = []; bumps = {};

  for (let x = 0; x < W; x++) if (!inPit(x)) { grid[10][x] = '#'; grid[11][x] = '#'; }
  const set = (x, y, c) => { grid[y][x] = c; };

  coinRow(10, 7, 5);
  row(16, 6, 4, '='); set(16, 6, 'B'); set(18, 6, 'B');
  spawns.push(22);
  coinRow(27, 6, 5);

  coinRow(35, 5, 4);

  row(63, 6, 5, '='); set(65, 6, 'B');

function spawnPlayer(inv) {

// ---------- Physics ----------
function isSolid(tx, ty) {
  if (tx < 0 || tx >= W) return true;
  if (ty < 0 || ty >= H) return false;
  return SOLID.has(grid[ty][tx]);
}
function hitTiles(e) {
  const out = [];
  for (let ty = Math.floor(e.y / T); ty <= Math.floor((e.y + e.h - 0.01) / T); ty++)
    for (let tx = Math.floor(e.x / T); tx <= Math.floor((e.x + e.w - 0.01) / T); tx++)
      if (isSolid(tx, ty)) out.push([tx, ty]);
  return out;
}
function move(e) {
  let hitX = false; const heads = [];
  e.x += e.vx;
  if (e.vx !== 0) for (const [tx] of hitTiles(e)) {
    if (e.vx > 0) e.x = tx * T - e.w; else e.x = (tx + 1) * T;
    hitX = true;
  }
  e.y += e.vy; e.onGround = false;
  let hitY = false;
  for (const [tx, ty] of hitTiles(e)) {
    if (e.vy > 0) { e.y = ty * T - e.h; e.onGround = true; }
    else if (e.vy < 0) { e.y = (ty + 1) * T; heads.push([tx, ty]); }
    hitY = true;
  }
  if (hitY) e.vy = 0;
  return {hitX, heads};
}
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ---------- Input ----------
const keys = {left: false, right: false, jump: false};
let jumpBuf = 0;
const KEYMAP = {ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
                Space: 'jump', ArrowUp: 'jump', KeyW: 'jump', KeyZ: 'jump'};
addEventListener('keydown', e => {

  if (state !== 'play' && state !== 'dying') return;

});
addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) keys[k] = false; });

// ---------- Update ----------
function hurt(fell) {
  if (!fell && player.inv > 0) return;
  lives--; state = 'dying';
  dyingT = fell ? 40 : 70;
  player.vy = fell ? 0 : -9; player.vx = 0;
}

function updatePlayer() {
  const p = player;
  const acc = p.onGround ? 0.55 : 0.35, max = 4.2;
  if (keys.left && !keys.right) { p.vx -= acc; p.face = -1; }
  else if (keys.right && !keys.left) { p.vx += acc; p.face = 1; }
  else { p.vx *= p.onGround ? 0.78 : 0.96; if (Math.abs(p.vx) < 0.1) p.vx = 0; }
  p.vx = clamp(p.vx, -max, max);

  if (p.onGround) p.coyote = 6; else if (p.coyote > 0) p.coyote--;
  if (jumpBuf > 0) jumpBuf--;
  if (jumpBuf > 0 && p.coyote > 0) { p.vy = -13; p.coyote = 0; jumpBuf = 0; }
  if (!keys.jump && p.vy < -4.5) p.vy = -4.5;
  p.vy = Math.min(p.vy + 0.6, 12);

  const r = move(p);
  if (r.heads.length) {
    const cx = p.x + p.w / 2;
    r.heads.sort((a, b) => Math.abs(a[0] * T + 16 - cx) - Math.abs(b[0] * T + 16 - cx));
    const [tx, ty] = r.heads[0];
    bumps[tx + ',' + ty] = 8;
    if (grid[ty][tx] === 'B') {
      grid[ty][tx] = 'E'; coinCount++;
      popups.push({x: tx * T + 16, y: ty * T - 4, vy: -6, t: 28, kind: 'coin'});
      popups.push({x: tx * T + 16, y: ty * T - 20, vy: -1.2, t: 40, kind: 'text', text: '+1'});
    }
  }
  if (p.x < cam) { p.x = cam; if (p.vx < 0) p.vx = 0; }
  p.run += Math.abs(p.vx) * 0.05;
  if (p.inv > 0) p.inv--;
  if (p.x > 80 * T && checkpoint < 80) checkpoint = 80;
  if (p.y > H * T + 30) { hurt(true); return; }
  if (p.x + p.w > GOAL_X * T + 8 && p.x < GOAL_X * T + 24) { state = 'win'; winPhase = 'walk'; winT = 0; finishTime = ticks / 60; }
}

function updateEnemies() {
  const p = player;
  for (const e of enemies) {
    if (!e.alive) continue;
    if (e.dead > 0) { if (--e.dead === 0) e.alive = false; continue; }
    if (e.x > cam + VW + 64) continue;
    e.vy = Math.min(e.vy + 0.6, 12);
    const r = move(e);
    if (r.hitX) e.vx = -e.vx;
    if (e.y > H * T) { e.alive = false; continue; }
    if (state === 'play' && overlap(p, e)) {
      if (p.vy > 0 && p.y + p.h - p.vy <= e.y + 8) {
        e.dead = 30; p.vy = keys.jump ? -11 : -7;
      } else hurt(false);
    }
  }
}

function checkCoins() {
  const px = player.x + player.w / 2, py = player.y + player.h / 2;
  for (const c of coins) {
    if (!c.got && Math.abs(px - c.x) < 20 && Math.abs(py - c.y) < 32) { c.got = true; coinCount++; }
  }
}

function update() {
  frame++;
  for (const k in bumps) if (--bumps[k] <= 0) delete bumps[k];
  if (popups) popups = popups.filter(o => { o.y += o.vy; if (o.kind === 'coin') o.vy += 0.4; return --o.t > 0; });
  if (state === 'play' || state === 'dying') {
    if (++ticks >= TIME_LIMIT * 60) { endRun('time'); return; }
  }
  updateConfetti();
  if (state === 'win') { updateWin(); return; }
  if (state === 'play') {
    updatePlayer();
    if (state === 'play') updateEnemies();
    if (state === 'play') checkCoins();
    cam = Math.min(clamp(player.x - VW * 0.4, cam, W * T - VW), W * T - VW);
  } else if (state === 'dying') {
    player.vy += 0.5; player.y += player.vy;

        spawnPlayer(90); resetEnemies();
        cam = clamp(player.x - VW * 0.4, 0, W * T - VW);
        state = 'play';

}

// ---------- Drawing ----------
function rr(x, y, w, h, r) {

  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();

function star(cx, cy, r, fill) {

    const a = -Math.PI / 2 + i * Math.PI / 5, rad = i % 2 ? r * 0.45 : r;
    ctx.lineTo(cx + Math.cos(a) * rad, cy + Math.sin(a) * rad);

}

function drawBackground() {

function hills(par, base, amp, color) {

  }

function drawTiles() {
  const x0 = Math.max(0, Math.floor(cam / T)), x1 = Math.min(W - 1, x0 + VW / T + 1);
  for (let ty = 0; ty < H; ty++) for (let tx = x0; tx <= x1; tx++) {

      ctx.fillRect(sx + 4 + h * 3, sy + 14, 4, 3); ctx.fillRect(sx + 20 - h, sy + 24, 3, 3);
      if (ty === 0 || grid[ty - 1][tx] !== '#') {
        ctx.fillStyle = '#7FB069'; ctx.fillRect(sx, sy, T, 7);
        ctx.fillStyle = '#A6D47E'; ctx.fillRect(sx, sy, T, 2);
        ctx.fillStyle = '#7FB069'; ctx.fillRect(sx + 6 + h, sy + 7, 3, 3); ctx.fillRect(sx + 22 - h, sy + 7, 3, 2);
      }

      ctx.fillStyle = '#5F597E'; ctx.fillRect(sx, sy + T - 4, T, 4); ctx.fillRect(sx + T - 3, sy, 3, T);

function drawGoal() {

function drawPlayer() {
  const p = player;
  if (state === 'board' && winPhase === 'party') return;
  if (state === 'play' && p.inv > 0 && frame % 6 < 3) return;
  let f, bob = 0;
  if (state === 'win') {
    if (winPhase === 'party') return;
    if (winPhase === 'enter') f = FR.idle;
    else if (!p.onGround) f = FR.jump;
    else { f = FR.run[Math.floor(p.run) % 4]; if (Math.floor(p.run) % 2) bob = -2; }
  }
  else if (state === 'dying' || !p.onGround) f = FR.jump;
  else if (Math.abs(p.vx) > 0.4) { f = FR.run[Math.floor(p.run) % 4]; if (Math.floor(p.run) % 2) bob = -2; }
  else { f = frame % 180 < 8 ? FR.blink : FR.idle; bob = Math.floor(frame / 30) % 2 ? -1 : 0; }
  ctx.save();
  ctx.imageSmoothingEnabled = false;
  ctx.translate(Math.round(p.x + p.w / 2), Math.round(p.y + p.h + bob));
  if (p.face < 0 && state !== 'win') ctx.scale(-1, 1);
  if (state === 'win' && winPhase === 'enter') ctx.globalAlpha = Math.max(0, winT / 24);
  ctx.drawImage(f, -16, -52, 32, 52);
  ctx.restore();
}

function drawEnemy(e) {
  ctx.save(); ctx.imageSmoothingEnabled = false;
  const x = Math.round(e.x), y = Math.round(e.y);
  if (e.dead > 0) { ctx.drawImage(ENEMY_FLAT, x, y + 12, 24, 8); ctx.restore(); return; }
  const img = ENEMY[Math.floor(frame / 10 + e.x * 0.01) % 2];
  if (e.vx > 0) { ctx.translate(x + 24, y); ctx.scale(-1, 1); ctx.drawImage(img, 0, 0, 24, 20); }
  else ctx.drawImage(img, x, y, 24, 20);
  ctx.restore();
}

function text(str, x, y, size, align, color, weight) {
  ctx.font = (weight || 600) + ' ' + size + 'px "Silkscreen", ui-monospace, monospace';
  ctx.textAlign = align || 'left';
  ctx.fillStyle = 'rgba(20,16,40,0.65)'; ctx.fillText(str, x + 2, y + 2);
  ctx.fillStyle = color || '#FFFFFF'; ctx.fillText(str, x, y);
}
function heart(x, y) {
  ctx.save(); ctx.imageSmoothingEnabled = false;
  ctx.drawImage(HEART, Math.round(x) - 9, Math.round(y), 18, 16);
  ctx.restore();
}

function drawHUD() {
  const left = state === 'win' ? TIME_LIMIT - finishTime : Math.max(0, TIME_LIMIT - ticks / 60);
  const warn = left <= 10 && state !== 'win' && frame % 30 < 15;
  text('TIME ' + Math.ceil(left), 16, 28, 18, 'left', warn ? '#FF6B6B' : '#FFFFFF');
  drawToken(160, 22, 1);
  text('× ' + coinCount, 180, 28, 18);
  if (playerName) text(playerName, VW / 2 + 40, 28, 16, 'center', '#FFE8A3', 400);
  for (let i = 0; i < lives; i++) heart(VW - 66 - i * 24, 14);
}

function overlay(title, lines) {
  ctx.fillStyle = 'rgba(20,16,40,0.62)'; ctx.fillRect(0, 0, VW, VH);
  text(title, VW / 2, VH / 2 - 30, 40, 'center', '#FFD23F');
  lines.forEach((l, i) => {
    if (i === lines.length - 1) ctx.globalAlpha = 0.6 + Math.sin(frame * 0.08) * 0.4;
    text(l, VW / 2, VH / 2 + 14 + i * 28, 18, 'center', '#FFFFFF', 400);
    ctx.globalAlpha = 1;
  });
}

function draw() {
  ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
  drawBackground();
  ctx.save();
  ctx.translate(-Math.round(cam), 0);
  drawBuilding(); drawTiles(); drawCoins(); drawGoal();
  for (const e of enemies) if (e.alive && e.x > cam - 40 && e.x < cam + VW + 40) drawEnemy(e);
  drawPlayer();
  for (const o of popups || []) {
    if (o.kind === 'coin') { drawToken(o.x, o.y, Math.sin(frame * 0.3), 9); }
    else { ctx.globalAlpha = Math.min(1, o.t / 15); text(o.text, o.x, o.y, 14, 'center'); ctx.globalAlpha = 1; }
  }
  ctx.restore();
  if (state !== 'name') drawHUD();
  drawConfetti();
}


// ---------- Name entry ----------
const namePanel = document.getElementById('namePanel');
const boardPanel = document.getElementById('boardPanel');
const nameInput = document.getElementById('nameInput');
const startBtn = document.getElementById('startBtn');
const boardBtn = document.getElementById('boardBtn');
const againBtn = document.getElementById('againBtn');
const osk = document.getElementById('osk');
const nameSub = document.getElementById('nameSub');
// Every screen gets the same controls: built-in keyboard and touch buttons are always shown.
document.addEventListener('gesturestart', e => e.preventDefault());
addEventListener('wheel', e => { if (e.ctrlKey) e.preventDefault(); }, {passive: false});
addEventListener('keydown', e => {
  if (e.ctrlKey && ['+', '-', '=', '0'].includes(e.key)) e.preventDefault();
  if (!pwPanel.hidden) {
    e.preventDefault();
    if (e.key === 'Enter') pwKey('DONE');
    else if (e.key === 'Escape') closePw();
    else if (e.key === 'Backspace') pwKey('BACK');
    else if (e.key.length === 1) pwKey(e.key.toUpperCase());
    return;
  }
  if (!dupPanel.hidden) {
    e.preventDefault();
    if (e.key === 'Enter') dupPlay(); else if (e.key === 'Escape' || e.key === 'Backspace') dupRename();
    return;
  }
  if (state !== 'name' || namePanel.hidden) return;
  if (e.key === 'Enter') { e.preventDefault(); tryStart(); return; }
  if (e.key === 'Backspace') { e.preventDefault(); typeKey('BACK'); return; }
  if (e.key.length === 1 && /^[A-Za-z0-9\u00C0-\u024F ._-]$/.test(e.key)) { e.preventDefault(); typeKey(e.key.toUpperCase()); }
});
const cleanName = v => v.replace(/[^A-Za-z0-9\u00C0-\u024F ._-]/g, '').replace(/\s+/g, ' ').slice(0, 12);
function syncName() {
  const v = cleanName(nameInput.value);
  if (v !== nameInput.value) nameInput.value = v;
  startBtn.disabled = !v.trim();
}
const sameName = (a, b) => String(a).trim().toUpperCase() === String(b).trim().toUpperCase();
function tryStart() {
  const v = cleanName(nameInput.value).trim().toUpperCase();
  if (!v) return;
  if (LB.rows.some(r => sameName(r.name, v))) { openDup(v); return; }
  startGame(v);
}
// ---------- Name already on the leaderboard ----------
const dupPanel = document.getElementById('dupPanel');
let dupName = '';
function openDup(v) {
  dupName = v;
  dupPanel.hidden = false;
}
function dupRename() { dupPanel.hidden = true; }
function dupPlay() { dupPanel.hidden = true; startGame(dupName); }
document.getElementById('dupRename').addEventListener('click', dupRename);
document.getElementById('dupPlay').addEventListener('click', dupPlay);
function typeKey(v) {
  if (v === 'BACK') nameInput.value = nameInput.value.slice(0, -1);
  else if (nameInput.value.length < 12 && !(v === ' ' && !nameInput.value)) nameInput.value += v;
  syncName();
}
nameInput.addEventListener('focus', () => nameInput.blur());
startBtn.addEventListener('click', tryStart);

const keyBtn = (label, v, cls) => {
  const b = document.createElement('button');
  b.type = 'button'; b.textContent = label; b.dataset.v = v;
  if (cls) b.className = cls;
  if (v === 'BACK') b.setAttribute('aria-label', 'Delete');
  return b;
};
function buildKeyboard(box, doneLabel, onKey) {
  const rows = [['1','2','3','4','5','6','7','8','9','0','BACK'], 'QWERTYUIOP'.split(''), 'ASDFGHJKL'.split(''), 'ZXCVBNM.-'.split('')];
  rows.forEach(r => {
    const row = document.createElement('div'); row.className = 'row';
    for (const ch of r) row.append(ch === 'BACK' ? keyBtn('⌫', 'BACK') : keyBtn(ch, ch));
    box.append(row);
  });
  const lastRow = document.createElement('div'); lastRow.className = 'row';
  lastRow.append(doneLabel ? keyBtn(doneLabel, 'DONE', 'go') : keyBtn('Space', ' ', 'wide'));
  box.append(lastRow);
  box.addEventListener('mousedown', e => e.preventDefault());
  box.addEventListener('pointerdown', e => {
    const b = e.target.closest('button'); if (!b) return;
    e.preventDefault();
    onKey(b.dataset.v);
  });
}
buildKeyboard(osk, '', typeKey);



// ---------- Leaderboard ----------
const LS_KEY = 'robot-run-leaderboard-v1';
const lbBody = document.getElementById('lbBody');
const resultTitle = document.getElementById('resultTitle');
const LB = {rows: [], db: null, useDb: false, mine: null};
const byRank = (a, b) => b.points - a.points || a.time - b.time || a.at - b.at;
function loadLocal() { try { return JSON.parse(localStorage.getItem(LS_KEY)) || []; } catch (e) { return []; } }
function saveLocal(rows) { try { localStorage.setItem(LS_KEY, JSON.stringify(rows.sort(byRank).slice(0, 200))); } catch (e) {} }
LB.rows = loadLocal();

// One row per name: a new run only replaces the old one when it scores higher.
function saveEntry(entry) {
  const same = LB.rows.filter(r => sameName(r.name, entry.name));
  if (same.some(r => byRank(r, entry) <= 0)) { LB.mine = null; return false; }
  LB.mine = entry;
  if (LB.db && LB.useDb) {
    (LB.docs || []).forEach(d => {
      const r = d.data();
      if (r && sameName(r.name, entry.name)) { try { (d.ref && d.ref.delete) ? d.ref.delete() : LB.db.collection('scores').doc(d.id).delete(); } catch (e) {} }
    });
    LB.db.collection('scores').add(entry).catch(() => {
      LB.useDb = false;
      const rows = loadLocal().filter(r => !sameName(r.name, entry.name)); rows.push(entry); saveLocal(rows); LB.rows = loadLocal();
      renderBoard();
    });
    LB.rows = LB.rows.filter(r => !sameName(r.name, entry.name)).concat(entry);
  } else {
    const rows = loadLocal().filter(r => !sameName(r.name, entry.name)); rows.push(entry); saveLocal(rows); LB.rows = loadLocal();
  }
  return true;
}

function cell(tr, v) { const td = document.createElement('td'); td.textContent = v; tr.append(td); }
function renderBoard() {
  const rows = LB.rows.slice().sort(byRank);
  while (lbBody.firstChild) lbBody.removeChild(lbBody.firstChild);
  if (!rows.length) {
    const tr = document.createElement('tr'); tr.className = 'empty';
    const td = document.createElement('td'); td.colSpan = 5; td.textContent = 'No finished runs yet. Be the first!';
    tr.append(td); lbBody.append(tr); return;
  }
  const mineIdx = LB.mine ? rows.findIndex(r => r.at === LB.mine.at && r.name === LB.mine.name) : -1;
  const addRow = (r, i) => {
    const tr = document.createElement('tr');
    if (i === mineIdx) tr.className = 'me';
    cell(tr, i + 1); cell(tr, r.name); cell(tr, r.gems); cell(tr, r.time.toFixed(1) + 's'); cell(tr, r.points.toLocaleString('en-US'));
    lbBody.append(tr);
  };
  rows.slice(0, 10).forEach(addRow);
  if (mineIdx >= 10) {
    const tr = document.createElement('tr'); tr.className = 'gap';
    const td = document.createElement('td'); td.colSpan = 5; td.textContent = '…'; tr.append(td); lbBody.append(tr);
    addRow(rows[mineIdx], mineIdx);
  }
  return mineIdx;
}

function endRun(reason) {
  state = 'board';
  keys.left = keys.right = keys.jump = false;
  if (reason === 'win') {
    const time = Math.round(finishTime * 10) / 10;
    const points = coinCount * 100 + Math.round((TIME_LIMIT - time) * 10);
    saveEntry({name: playerName, gems: coinCount, time, points, at: Date.now()});
    const rank = renderBoard() + 1;
    resultTitle.textContent = rank === 1 ? 'High score!' : 'Scoreboard';
  } else {
    LB.mine = null; renderBoard();
    resultTitle.textContent = reason === 'time' ? 'Time’s up!' : 'Out of lives!';
  }
  againBtn.textContent = 'Play again';
  boardPanel.hidden = false;
  againBtn.focus();
}
function showNameEntry() {
  state = 'name';
  boardPanel.hidden = true; namePanel.hidden = false;
  nameInput.value = ''; syncName();
  osk.hidden = false; nameSub.hidden = true; boardBtn.parentElement.hidden = false;
  setCompact(false);
}
boardBtn.addEventListener('click', () => {
  LB.mine = null; renderBoard();
  resultTitle.textContent = 'Scoreboard';
  againBtn.textContent = 'Back';
  namePanel.hidden = true; boardPanel.hidden = false; state = 'board';
  againBtn.focus();
});
againBtn.addEventListener('click', showNameEntry);

// ---------- Scoreboard reset (password protected) ----------
const RESET_PASSWORD = 'DISCOVER2026';
const pwPanel = document.getElementById('pwPanel');
const pwInput = document.getElementById('pwInput');
const pwMsg = document.getElementById('pwMsg');
const pwOsk = document.getElementById('pwOsk');
let pwValue = '';
function pwShow() { pwInput.value = '•'.repeat(pwValue.length); }
function openPw() {
  pwValue = ''; pwShow(); pwMsg.textContent = ''; pwMsg.className = 'pwmsg';
  pwPanel.hidden = false;
}
function closePw() { pwPanel.hidden = true; pwValue = ''; pwShow(); againBtn.focus(); }
function resetScores() {
  try { localStorage.removeItem(LS_KEY); } catch (e) {}
  if (LB.db && LB.docs) {
    for (const d of LB.docs) {
      try { (d.ref && d.ref.delete) ? d.ref.delete() : LB.db.collection('scores').doc(d.id).delete(); } catch (e) {}
    }
  }
  LB.rows = []; LB.mine = null; renderBoard();
  if (resultTitle.textContent === 'High score!') resultTitle.textContent = 'Scoreboard';
}
function pwKey(v) {
  if (v === 'DONE') {
    if (pwValue === RESET_PASSWORD) {
      resetScores();
      pwMsg.textContent = 'Scoreboard reset.'; pwMsg.className = 'pwmsg ok';
      setTimeout(closePw, 900);
    } else {
      pwMsg.textContent = 'Wrong password.'; pwMsg.className = 'pwmsg';
      pwValue = ''; pwShow();
    }
    return;
  }
  pwMsg.textContent = '';
  if (v === 'BACK') pwValue = pwValue.slice(0, -1);
  else if (pwValue.length < 24 && v !== ' ') pwValue += v;
  pwShow();
}
buildKeyboard(pwOsk, 'Enter', pwKey);
document.getElementById('resetBtn').addEventListener('click', openPw);
document.getElementById('pwCancel').addEventListener('click', closePw);
document.getElementById('pwOk').addEventListener('click', () => pwKey('DONE'));

// ---------- Loop ----------
buildLevel(); popups = []; spawnPlayer(0); resetEnemies();
let last = performance.now(), acc = 0;
const STEP = 1000 / 60;
function loop(t) {
  acc += Math.min(t - last, 100); last = t;
  while (acc >= STEP) { update(); acc -= STEP; }
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
showNameEntry();
})();
</script>
</body>
